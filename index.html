<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="点点虫の日本での新たな取り組みをご紹介します。">
  <meta name="theme-color" content="#102c3b">
  <title>点点虫｜日本での新たな一歩</title>
  <style>
    :root { color-scheme: dark; --text:#f6f3ec; --muted:#c2cdd0; --accent:#dfc59c; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--text); background:#102c3b; font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif; line-height:2; }
    .scenery { position:fixed; inset:0; overflow:hidden; z-index:-1; background:radial-gradient(ellipse at 76% 18%,#99aca94d,transparent 43%),radial-gradient(ellipse at 14% 54%,#467b8750,transparent 48%),linear-gradient(150deg,#102735,#244954 62%,#172d3a); }
    .scenery::before { content:""; position:absolute; width:clamp(110px,19vw,260px); aspect-ratio:1; top:17%; right:17%; border-radius:50%; background:radial-gradient(circle at 38% 32%,#faf0d9,#cecfbb); box-shadow:0 0 100px #e2e5c229; opacity:.72; }
    .mountain { position:absolute; inset:45% -5% -2%; background:linear-gradient(160deg,#41636b,#1b394a); clip-path:polygon(0 56%,12% 42%,24% 56%,44% 9%,58% 40%,70% 21%,87% 55%,100% 38%,100% 100%,0 100%); opacity:.78; }
    .mountain.front { inset:66% -5% -2%; background:linear-gradient(160deg,#1f414c,#0b202e); clip-path:polygon(0 33%,14% 50%,30% 23%,47% 52%,67% 13%,82% 40%,100% 23%,100% 100%,0 100%); opacity:.95; }
    .container { width:min(1120px,88%); margin-inline:auto; }
    header { border-bottom:1px solid #ffffff1a; }
    nav { display:flex; justify-content:space-between; align-items:center; gap:24px; min-height:94px; }
    .brand { color:var(--text); text-decoration:none; font-size:22px; letter-spacing:.2em; font-family:"Yu Mincho","Hiragino Mincho ProN",serif; }
    .brand small { color:var(--muted); font:11px "Yu Gothic",sans-serif; letter-spacing:.12em; margin-left:18px; }
    .nav-links { display:flex; align-items:center; gap:30px; font-size:12px; letter-spacing:.12em; }
    a { color:inherit; text-underline-offset:6px; }
    .nav-links a { text-decoration:none; }
    .official-pending { color:var(--muted); font-size:11px; }
    .hero { min-height:calc(100svh - 94px); display:flex; align-items:center; padding-block:85px; }
    .hero-content { max-width:750px; }
    .eyebrow { display:flex; gap:16px; align-items:center; color:var(--accent); font-size:12px; letter-spacing:.24em; }
    .eyebrow::before { content:""; width:38px; height:1px; background:var(--accent); }
    h1,h2 { font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif; font-weight:400; }
    h1 { font-size:clamp(36px,5.4vw,68px); line-height:1.65; letter-spacing:.1em; margin:28px 0; text-shadow:0 2px 24px #102735; }
    .hero p { max-width:490px; color:var(--muted); font-size:14px; letter-spacing:.06em; }
    .button { display:inline-flex; gap:36px; align-items:center; padding:13px 25px; margin-top:28px; border:1px solid #dfc59c80; text-decoration:none; font-size:12px; letter-spacing:.13em; transition:background .2s; }
    .button:hover { background:#dfc59c18; }
    .intro { padding-block:96px; background:#0b202edd; border-block:1px solid #ffffff14; scroll-margin-top:24px; }
    .intro-layout { display:grid; grid-template-columns:1fr 1.3fr; gap:70px; }
    .section-label { color:var(--accent); font-size:11px; letter-spacing:.2em; }
    h2 { font-size:clamp(26px,3vw,38px); line-height:1.7; letter-spacing:.08em; margin:18px 0; }
    .intro-copy { color:var(--muted); font-size:14px; letter-spacing:.04em; }
    .intro-copy p { margin:0 0 24px; }
    footer { padding-block:28px; font-size:11px; color:var(--muted); letter-spacing:.1em; }
    .footer-inner { display:flex; justify-content:space-between; gap:20px; }
    a:focus-visible { outline:2px solid var(--accent); outline-offset:6px; }
    @media(max-width:680px) { nav { min-height:82px; gap:12px; } .brand small { display:none; } .nav-links { gap:15px; font-size:11px; } .official-pending { max-width:100px; line-height:1.6; } .hero { min-height:calc(100svh - 82px); padding-block:65px; } h1 { font-size:clamp(30px,7vw,44px); letter-spacing:.05em; } .scenery::before { right:9%; top:22%; opacity:.48; } .intro { padding-block:60px; } .intro-layout { grid-template-columns:1fr; gap:24px; } .footer-inner { flex-direction:column; gap:4px; } }
    @media(prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } .button { transition:none; } }
  </style>
</head>
<body>
  <div class="scenery" aria-hidden="true"><div class="mountain"></div><div class="mountain front"></div></div>
  <header>
    <nav class="container" aria-label="メインナビゲーション">
      <a class="brand" href="./">点点虫<small>日本での新たな一歩</small></a>
      <div class="nav-links">
        <a href="#intro">私たちについて</a>
        <!-- 公式サイトのURLが決まり次第、このspanをa要素に置き換えます。 -->
        <span class="official-pending">公式サイトは準備中</span>
      </div>
    </nav>
  </header>
  <main>
    <!-- 正式な紹介文を受け取り次第、以下の仮の文章を差し替えます。 -->
    <section class="hero container" aria-labelledby="hero-title">
      <div class="hero-content">
        <div class="eyebrow">日本での、新しいはじまり</div>
        <h1 id="hero-title">小さな一歩から、<br>新しい物語を。</h1>
        <p>点点虫は、日本での新たな取り組みを準備しています。<br>私たちの想いと、これからの歩みをご紹介します。</p>
        <a class="button" href="#intro">私たちについて<span aria-hidden="true">↓</span></a>
      </div>
    </section>
    <section class="intro" id="intro" aria-labelledby="intro-title">
      <div class="container intro-layout">
        <div><div class="section-label">ご紹介</div><h2 id="intro-title">私たちの想い、<br>これからのこと。</h2></div>
        <div class="intro-copy">
          <p>私たちは、一つひとつの出会いを大切にしながら、日本での新しい可能性を探しています。</p>
          <p>現在、新たな取り組みの準備を進めています。詳しい内容は、こちらのページで順次ご紹介していきます。</p>
          <p>これからの点点虫を、どうぞよろしくお願いいたします。</p>
        </div>
      </div>
    </section>
  </main>
  <footer><div class="container footer-inner"><span>© 点点虫</span><span>日本での新たな一歩</span></div></footer>
</body>
</html>
